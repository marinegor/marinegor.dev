# ruff (python formatter + linter) config — https://docs.astral.sh/ruff/
# Repo-local on purpose: overrides any user-global ruff config.
target-version = "py310"
line-length = 88

[lint]
select = [
  "E4", "E7", "E9", # pycodestyle errors
  "F",              # pyflakes
  "I",              # isort
  "B",              # bugbear
  "UP",             # pyupgrade
]

[lint.per-file-ignores]
# marimo notebooks: the last bare expression of a cell is its output
"notebooks/**/*.py" = ["B018"]
