baseURL = 'https://marinegor.dev'
locale = 'en-us'
title = 'marinegor.dev'
theme = 'typo'
copyright = "Egor Marin"

[taxonomies]
tag = 'tags'

[pagination]
pagerSize = 100

[markup.highlight]
noClasses = false # typo ships its own chroma css (light + dark)

[params]
description = 'Website with code snippets, informal project descriptions, and some ranting when I get older'

# Appearance: light/dark follows the OS, with a toggle
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Home page
homeIntroTitle = 'Hi!'
homeIntroContent = """
I'm Egor, a Forward-Deployed ML Engineer in Cofolding @ [Apheris](https://apheris.com). \
This is a website with code snippets, informal project descriptions, \
and some ranting when I get older.
"""
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'
singleDateFormat = '2 Jan 2006'

# KaTeX on every page ($...$ and $$...$$)
math = true

# Footer
showFooter = true
footerContent = "© Egor Marin"

[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "~"

# Social icons (names are simple-icons slugs)
[[params.social]]
name = "github"
url = "https://github.com/marinegor"

[[params.social]]
name = "x"
title = "Twitter"
url = "https://twitter.com/egor__marin/"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/marinegor/"

[[params.social]]
name = "bluesky"
url = "https://bsky.app/profile/marinegor.bsky.social"

[[params.social]]
name = "googlescholar"
title = "Google Scholar"
url = "https://scholar.google.com/citations?user=FJbv9XcAAAAJ"

# Main menu
[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "til"
url = "/til"

[[params.menu]]
name = "publications"
url = "/pages/publications"

[[params.menu]]
name = "cv"
url = "/pages/cv"

[[params.menu]]
name = "tags"
url = "/tags"

[[params.menu]]
name = "pages"
url = "/pages"

# Serve ./notebooks (marimo notebooks, PEP 723 scripts) as-is under /notebooks/.
# Defining mounts replaces the default static mount, so re-add it.
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "notebooks"
target = "static/notebooks"
files = ["! **/__marimo__/**", "! **/__pycache__/**", "! **.md"]
